[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetsync"
version = "0.1.0"
description = "Sync local CSV data directly to Google Sheets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sheetsync = "sheetsync.cli:main"

[tool.setuptools.packages.find]
include = ["sheetsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]